<!doctype html>
<meta charset="utf-8">
<title>Knightly tests</title>
<pre id="out">running…</pre>
<script type="module">
import { Chess } from '../vendor/chess.js';
import { LESSONS } from '../js/lessons.js';
import { COURSES } from '../js/courses.js';
import { engine, analyser } from '../js/engine.js';
import { gradeMoves, seeGain, sacrificed, phaseOf, gameAccuracy, gameRating } from '../js/grading.js';
import { BOTS, botMove, thinkTime } from '../js/bots.js';
import { explainMove, mistakeReason, movesInWords, whatIfMove, compareMoves, lineGain, hintIdea, runnerUp, evalWords, shiftWords } from '../js/explain.js';
import { loadOpenings, isBook, bookMoves } from '../js/openings.js';
import { scoreToCp, uciToMove } from '../js/util.js';

const lines = [];
let fails = 0;
const log = (ok, msg) => { if (!ok) fails++; lines.push((ok ? 'PASS ' : 'FAIL ') + msg); };
const info = msg => lines.push('INFO ' + msg);
const flush = () => { document.getElementById('out').textContent = lines.join('\n'); };

function setup(step) {
  if (step.fen) return new Chess(step.fen);
  if (step.line) { const c = new Chess(); for (const s of step.line.split(/\s+/)) c.move(s); return c; }
  return null;
}

// score from the mover's perspective after playing uci
async function moverScore(fen, uci, depth = 14) {
  const c = new Chess(fen);
  const mover = c.turn();
  c.move(uciToMove(uci));
  if (c.isCheckmate()) return 100000;
  if (c.isDraw()) return 0;
  const r = await engine.analyse(c.fen(), { depth });
  const white = scoreToCp(r.score);
  return mover === 'w' ? white : -white;
}

async function run() {
  await engine.init();
  info('engine ready');
  const r0 = await engine.analyse(new Chess().fen(), { depth: 10 });
  log(!!r0.bestmove, 'engine start position bestmove ' + r0.bestmove);

  // ---------- lessons ----------
  for (const l of LESSONS) {
    for (let i = 0; i < l.steps.length; i++) {
      const s = l.steps[i];
      const tag = `lesson ${l.id} step ${i + 1}`;
      let c;
      try { c = setup(s); } catch (e) { log(false, `${tag} setup: ${e.message}`); continue; }
      if (!c) { if (s.task || s.play) log(false, `${tag} task without position`); continue; }
      if (s.showMoves && !c.get(s.showMoves)) log(false, `${tag} showMoves square empty`);
      if (s.arrows) for (const a of s.arrows) if (!/^[a-h][1-8]$/.test(a[0]) || !/^[a-h][1-8]$/.test(a[1])) log(false, `${tag} bad arrow`);
      if (s.task && !s.task.anyMove) {
        const t = s.task;
        const fen0 = c.fen();
        // solution legality
        const w = new Chess(fen0);
        let ok = true;
        for (const u of t.solution) { try { w.move(uciToMove(u)); } catch { ok = false; log(false, `${tag} illegal solution move ${u}`); break; } }
        if (!ok) continue;
        if (t.mate) log(w.isCheckmate(), `${tag} solution ends in mate`);
        for (const a of (t.accept || [])) { try { new Chess(fen0).move(uciToMove(a)); } catch { log(false, `${tag} illegal accept ${a}`); } }
        // engine: compare each accepted first move with the engine's best
        const best = await engine.analyse(fen0, { depth: 16 });
        const bestScore = await moverScore(fen0, best.bestmove, 14);
        const firsts = t.accept || [t.solution[0]];
        for (const f of firsts) {
          const sc = await moverScore(fen0, f, 14);
          // 'teach' moves are sound book/principle moves; allow engine noise at this depth
          const good = t.teach ? sc > -90 : (sc >= bestScore - 80 || sc > 600);
          log(good, `${tag} move ${f} score ${sc} vs engine best ${best.bestmove} ${bestScore}`);
        }
      }
      if (s.task && s.task.anyMove) log(c.moves().length > 0, `${tag} has legal moves`);
      if (s.play) {
        const r = await engine.analyse(c.fen(), { depth: 16 });
        const sc = scoreToCp(r.score) * (c.turn() === 'w' ? 1 : -1);
        log(sc > 400, `${tag} play position winning for student (${sc})`);
      }
    }
  }
  flush();

  // ---------- courses ----------
  for (const co of COURSES) {
    const c = new Chess();
    try { for (const m of co.moves) c.move(m); log(true, `course ${co.id} line legal (${co.moves.length} plies)`); }
    catch (e) { log(false, `course ${co.id}: ${e.message}`); }
    for (const k of Object.keys(co.notes)) if (+k >= co.moves.length) log(false, `course ${co.id} note index ${k} out of range`);
    const last = co.moves.length - 1;
    // last move should be by... nothing required. Check final eval not losing for the student
    const r = await engine.analyse(c.fen(), { depth: 12 });
    const sc = scoreToCp(r.score) * (co.side === 'w' ? 1 : -1);
    log(sc > (co.level === 'Advanced' ? -250 : -170), `course ${co.id} final position ok for student (${sc})`);
  }
  flush();

  // ---------- puzzles ----------
  try {
    const db = await fetch('../data/puzzles.json').then(r => r.json());
    let bad = 0;
    const buckets = {};
    for (const p of db) {
      try {
        const c = new Chess(p.fen);
        for (const u of p.m.split(' ')) c.move(uciToMove(u));
      } catch (e) { bad++; if (bad < 5) info(`bad puzzle ${p.id}: ${e.message}`); }
      const b = Math.floor(p.r / 200) * 200; buckets[b] = (buckets[b] || 0) + 1;
    }
    log(bad === 0, `puzzles: ${db.length} total, ${bad} invalid`);
    info('rating buckets ' + JSON.stringify(buckets));
  } catch (e) { info('puzzles not available: ' + e.message); }
  flush();

  // ---------- bots ----------
  const testFen = 'r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3';
  for (const b of BOTS) {
    const c = new Chess(testFen);
    const t0 = performance.now();
    const u = await botMove(b, c);
    let legal = false;
    try { c.move(uciToMove(u)); legal = true; } catch { }
    log(legal, `bot ${b.id} move ${u} in ${Math.round(performance.now() - t0)}ms`);
  }
  // ---------- how the bots open ----------
  await loadOpenings();
  log(bookMoves([])[0].san === 'e4' && !bookMoves([]).some(m => m.san === 'f3') && bookMoves(['f3']).length === 0, 'the bots\' book starts with 1.e4 and has no unsound lines');
  const firsts = new Set();
  for (let k = 0; k < 14; k++) {
    const how = {};
    const u = await botMove(BOTS[5], new Chess(), engine, how);
    firsts.add(how.book ? u : `${u} (not from the book)`);
  }
  log([...firsts].every(u => ['e2e4', 'd2d4', 'c2c4'].includes(u)) && firsts.size > 1, 'bots open with a mainstream first move, and not always the same: ' + [...firsts].join(' '));
  const afterE4 = new Chess();
  afterE4.move('e4');
  const replyHow = {};
  const reply = await botMove(BOTS[0], afterE4, engine, replyHow);
  log(replyHow.book && ['e7e5', 'c7c5', 'e7e6', 'c7c6'].includes(reply), 'even the weakest bot answers 1.e4 with a known defence: ' + reply);
  const afterH3 = new Chess();
  afterH3.move('h3');
  const oddHow = {};
  await botMove(BOTS[2], afterH3, engine, oddHow);
  log(!oddHow.book, 'an offbeat first move gets no book reply');
  const fenHow = {};
  await botMove(BOTS[2], new Chess(testFen), engine, fenHow);
  log(!fenHow.book, 'a position set up from a FEN is not looked up in the book');
  const quick = thinkTime(new Chess(), 'e2e4', { book: true }), slow = thinkTime(new Chess(testFen), 'g8f6');
  log(quick >= 400 && quick <= 900 && slow >= 600 && slow <= 3000, `bots answer book moves quickly and think longer otherwise (${Math.round(quick)} and ${Math.round(slow)} ms)`);

  // promotion move format from engine
  const pc = new Chess('8/4P1k1/8/8/8/8/8/4K3 w - - 0 1');
  const pr = await engine.analyse(pc.fen(), { depth: 8 });
  log(pr.bestmove === 'e7e8q', 'engine promotion uci ' + pr.bestmove);

  // ---------- opening book ----------
  await loadOpenings();
  for (const l of ['f3', 'e4 e5 Qh5', 'e4 e5 Nf3 f5', 'f3 e5 g4']) log(!isBook(l.split(' ')), `dubious line is not book: ${l}`);
  for (const l of ['e4 Nf6', 'f4', 'd4 f5', 'e4 e5 Nf3 Nc6 Bc4']) log(isBook(l.split(' ')), `sound line is book: ${l}`);
  log(COURSES.every(c => isBook(c.moves.slice(0, 1))), 'every course starts in book');

  // ---------- coach explanations ----------
  const plain = r => r.reasons.join(' ').replace(/<[^>]+>/g, '');
  const defended = '4k3/pp3ppp/2n1p3/3p4/2P5/8/PP3PPP/4K3 w - - 0 1';
  log(!/takes back/.test(plain(explainMove(defended, 'c4d5'))), 'behind in material is not a recapture');
  log(/takes back on d5/.test(plain(explainMove(defended, 'c4d5', {}, { captured: 'p', to: 'd5' }))), 'a real recapture says takes back');
  const exchange = { score: { cp: 200 }, lines: [{ pv: ['e2h5', 'f7f6', 'h5e8', 'd6e8'] }] };
  log(/the exchange \(a rook for a bishop\)/.test(plain(explainMove('4r3/5k2/3n4/8/8/8/4B3/3K4 w - - 0 1', 'e2h5', exchange))), 'a rook for a bishop is called the exchange');
  log(/pawn on f5/.test(plain(explainMove('4k3/8/8/4Pp2/8/8/8/4K3 w - f6 0 1', 'e5f6'))), 'en passant names the captured pawn\'s square');
  const ruy = 'r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3';
  log(mistakeReason(ruy, 'a7a6', { replyUci: 'b5c6' }) === '', 'a fair trade is not called a loss');

  // ---------- what if ----------
  const strip = h => h.replace(/<[^>]+>/g, '');
  log(strip(movesInWords(new Chess().fen(), ['e2e4', 'e7e5', 'g1f3'])) === 'you play e4, they reply e5, then you play Nf3', 'line in words from the mover');
  log(strip(movesInWords(new Chess().fen(), ['e2e4', 'e7e5'], 4, 'b')) === 'they play e4, you reply e5', 'line in words when the opponent moves first');
  const fool = 'rnbqkbnr/pppp1ppp/8/4p3/6P1/5P2/PPPPP2P/RNBQKBNR b KQkq - 0 2';
  log(/checkmate, so you win/.test(strip(whatIfMove(fool, 'd8h4', null, null, 'b').html)), 'what if: your mate is a win');
  log(/checkmate, so you would lose/.test(strip(whatIfMove(fool, 'd8h4', null, null, 'w').html)), 'what if: their mate is a loss');
  const afterMove = (fen, uci) => { const t = new Chess(fen); t.move(uciToMove(uci)); return t.fen(); };
  const open4 = 'r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3';
  const wi0 = await engine.analyse(open4, { depth: 11 });
  const fen1 = afterMove(open4, 'f3e5');
  const wi1 = await engine.analyse(fen1, { depth: 11 });
  const mineWi = whatIfMove(open4, 'f3e5', wi0, wi1, 'w');
  log(/Their best reply is/.test(strip(mineWi.html)) && mineWi.arrows.length === 1, 'what if: your move shows their reply: ' + strip(mineWi.html));
  const wi2 = await engine.analyse(afterMove(fen1, wi1.bestmove), { depth: 11 });
  const theirWi = whatIfMove(fen1, wi1.bestmove, wi1, wi2, 'w');
  log(/their best move/.test(strip(theirWi.html)) && /Your best answer is/.test(strip(theirWi.html)), 'what if: their best move shows your answer: ' + strip(theirWi.html));
  const cmp = compareMoves(open4, await engine.analyse(open4, { depth: 11, multipv: 3 }), 'w');
  log(cmp.arrows.length === 3 && (cmp.html.match(/<li>/g) || []).length === 3, 'compare lists three moves: ' + strip(cmp.html).slice(0, 160));
  const forced = '7k/8/8/8/8/8/6q1/7K w - - 0 1';
  log(/only legal move/.test(strip(compareMoves(forced, await engine.analyse(forced, { depth: 8, multipv: 3 }), 'w').html)), 'compare says when there is one legal move');
  log(/queen on e5 where it can be taken/.test(mistakeReason('r1b1kbnr/pppp1ppp/2n5/4p2Q/4P3/8/PPPP1PPP/RNB1KBNR w KQkq - 2 3', 'h5e5', { replyUci: 'c6e5' })), 'a hanging piece is called out');

  // ---------- what the coach says about the best moves ----------
  const forkFen = 'r3k2r/ppp2ppp/2n5/3N4/8/8/PPP2PPP/R3K2R w KQkq - 0 12';
  const forkLine = ['d5c7', 'e8d7', 'c7a8', 'h8a8'];
  const forkSeen = { score: { cp: 400 }, lines: [{ pv: forkLine }] };
  log(lineGain(forkFen, forkLine, 'w').text === 'a rook and a pawn for a knight', 'a won exchange of pieces is put in words: ' + lineGain(forkFen, forkLine, 'w').text);
  log(lineGain(forkFen, ['d5c7', 'e8d7'], 'w').gain === 1 && lineGain(forkFen, ['d5f6', 'g7f6'], 'w').gain === -3, 'a capture counts only after the reply');
  const forkEx = explainMove(forkFen, 'd5c7', forkSeen);
  log(/fork/.test(plain(forkEx)) && forkEx.tactical, 'a fork is named: ' + plain(forkEx));
  log(/double attack/.test(strip(hintIdea(forkFen, 'd5c7', forkSeen))), 'the first hint gives the idea, not the move');
  log(/could have won a rook and a pawn for a knight/.test(strip(mistakeReason(forkFen, 'h2h3', { bestUci: 'd5c7', pvBest: forkLine, pvAfter: ['e8c8'] }))), 'a missed tactic is spelled out');
  log(/loses a rook: they play Nc2\+, you reply Kd2, then they play Nxa1/.test(strip(mistakeReason('4k3/8/8/8/1n6/8/7P/R3K3 w - - 0 1', 'h2h3', { pvAfter: ['b4c2', 'e1d2', 'c2a1'] }))), 'a loss a few moves deep is spelled out');
  const twoTakers = 'r1bqkb1r/ppp2ppp/2n5/3np3/2B5/2N2N2/PPPP1PPP/R1BQK2R w KQkq - 0 6';
  log(mistakeReason(twoTakers, 'c3d5', { bestUci: 'c4d5', replyUci: 'd8d5' }) === '', 'taking the same piece another way is not a missed capture');
  log(/pins their knight on c6 to the king/.test(plain(explainMove('r2qkbnr/ppp2ppp/2np4/4p3/4P1b1/2N2N2/PPPP1PPP/R1BQKB1R w KQkq - 2 5', 'f1b5'))), 'a pin is named');
  log(/discovered check/.test(plain(explainMove('4k3/8/8/8/4N3/8/8/4RK2 w - - 0 1', 'e4d6'))), 'a discovered check is named');
  log(!/attacks/.test(plain(explainMove('4k3/8/8/3b4/8/8/8/3RK3 w - - 0 1', 'd1d2'))), 'an attack that was already there is not news');
  log(!/open file/.test(plain(explainMove('4k3/8/8/8/8/8/8/3RK3 w - - 0 1', 'd1d4'))), 'a rook staying on its file does not reach an open file');
  log(/opens a line for your bishop and queen/.test(plain(explainMove(new Chess().fen(), 'e2e4'))), '1.e4 opens lines');
  const quietC3 = explainMove('r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4', 'c2c3', { score: { cp: 60 }, lines: [{ pv: ['c2c3', 'g8f6', 'd2d4'] }] });
  log(/prepares the pawn push d4/.test(plain(quietC3)), 'a preparing move names what it prepares: ' + plain(quietC3));
  const theirA6 = plain(explainMove(ruy, 'a7a6', {}, null, 'w'));
  log(/your bishop on b5/.test(theirA6), 'an opponent move is told from your side: ' + theirA6);
  log(evalWords({ cp: 800 }, 'w') === "you're winning (+8.0)" && evalWords({ cp: 800 }, 'b') === "you're losing (-8.0)", 'a big lead is called winning');
  log(shiftWords(200, 0) === 'It takes you from a better position to an equal position.' && shiftWords(0, 200) === '', 'a drop is described, a gain is not');
  log(runnerUp(forced, await engine.analyse(forced, { depth: 8, multipv: 3 })) === 'It is the only legal move.', 'a hint says when there is no choice');
  const cut = await engine.analyse(open4, { depth: 18, multipv: 3, movetime: 400 });
  log(cut.lines.length === 3 && new Set(cut.lines.map(l => l.move)).size === 3 && cut.lines.every(l => l.depth === cut.lines[0].depth) && cut.bestmove === cut.lines[0].move,
    'a search cut short still ranks three different moves at one depth: ' + cut.lines.map(l => `${l.move}@${l.depth}`).join(' '));
  // a move that gives material away on purpose must say so, and say what it buys
  const sacFen = 'r2qkbnr/1b1npppp/p1p5/1p1pP3/P2P4/1PNBBN2/2P2PPP/R1Q1K2R w KQkq - 1 10';
  const sacSeen = { score: { cp: 370 }, lines: [{ pv: ['e5e6', 'f7e6', 'c3e2', 'g8h6'] }] };
  const sac = explainMove(sacFen, 'e5e6', sacSeen);
  log(/gives up a pawn on purpose/.test(plain(sac)) && /doubled on the e-file/.test(plain(sac)) && /blocks their bishop on f8/.test(plain(sac)) && !sac.generic,
    'a pawn sacrifice is called one, with what it buys: ' + plain(sac));
  log(/gives something up/.test(strip(hintIdea(sacFen, 'e5e6', sacSeen))), 'the first hint for a sacrifice says something is offered');
  const swap = plain(explainMove('4k3/8/8/3p4/8/2N1P3/8/4K3 w - - 0 30', 'e3e4', { score: { cp: 0 }, lines: [{ pv: ['e3e4', 'd5e4', 'c3e4', 'e8e7'] }] }));
  log(/offers a trade: you play e4, they reply dxe4, then you play Nxe4/.test(swap) && !/on purpose/.test(swap), 'a pawn that comes straight back is a trade, not a sacrifice: ' + swap);
  const allowed = plain(explainMove(ruy, 'a7a6', { score: { cp: 40 }, lines: [{ pv: ['a7a6', 'b5c6', 'd7c6', 'e1g1'] }] }));
  log(!/offers|gives up/.test(allowed), 'letting them trade pieces is neither an offer nor a sacrifice: ' + allowed);
  const lost = plain(explainMove(sacFen, 'e5e6', { score: { cp: -300 }, lines: [{ pv: ['e5e6', 'f7e6', 'c3e2', 'g8h6'] }] }));
  log(/holding on to it would cost more/.test(lost), 'in a bad position, giving material is not dressed up as a sacrifice');
  const backRank = '6k1/5ppp/8/8/8/8/q4PPP/3R2K1 w - - 0 30';
  const mateCmp = strip(compareMoves(backRank, await engine.analyse(backRank, { depth: 10, multipv: 3 }), 'w').html).replace(/\s+/g, ' ');
  log(/forces checkmate/.test(mateCmp) && /misses the forced checkmate/.test(mateCmp), 'compare says what the other moves miss: ' + mateCmp.slice(0, 140));

  // ---------- positional reasons ----------
  const why = (fen, uci, pv = [uci], cp = 0) => plain(explainMove(fen, uci, { score: { cp }, lines: [{ pv }] }));
  const outpost = why('4k3/pp3ppp/3p4/8/4P3/2N5/PPP2PPP/4K3 w - - 0 20', 'c3d5');
  log(/outpost on d5/.test(outpost), 'a knight on a square no pawn can chase it from is an outpost: ' + outpost);
  const fian = why('rnbqkbnr/pppppppp/8/8/8/6P1/PPPPPP1P/RNBQKBNR w KQkq - 0 2', 'f1g2');
  log(/long diagonal/.test(fian), 'a fianchetto is named: ' + fian);
  const doubled = why('6k1/5ppp/8/8/8/8/R4PPP/3R2K1 w - - 0 25', 'a2d2');
  log(/doubles your rooks on the d-file/.test(doubled), 'doubling rooks is named: ' + doubled);
  const luft = why('r5k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 25', 'h2h3');
  log(/luft/.test(luft), 'a pawn step that frees the king is luft: ' + luft);
  const active = why('k7/8/8/8/8/N7/8/4K3 w - - 0 40', 'a3c4');
  log(/much more active: it reaches 8 squares instead of 4/.test(active), 'a piece that gains many squares is more active: ' + active);
  const tradeAhead = why('3q1rk1/5ppp/8/8/8/8/5PPP/RR1Q2K1 w - - 0 40', 'd1d8', ['d1d8', 'f8d8'], 500);
  log(/trades queens/.test(tradeAhead) && /ahead in material/.test(tradeAhead), 'trading when ahead says why: ' + tradeAhead);
  const plan = why('r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3', 'h2h3', ['h2h3', 'g8f6', 'b1c3']);
  log(!/no tactic/.test(plan), 'a quiet move names the plan when the engine has one: ' + plan);

  // ---------- game review grading ----------
  const hanging = new Chess('4k3/8/8/3n4/8/8/8/3QK3 w - - 0 1');
  log(seeGain(hanging, 'd5') === 3, 'a loose knight can be won: ' + seeGain(hanging, 'd5'));
  const guarded = new Chess('4k3/8/4p3/3n4/4P3/8/8/4K3 w - - 0 1');
  log(seeGain(guarded, 'd5') === 2, 'pawn takes a knight that a pawn guards: wins 2, got ' + seeGain(guarded, 'd5'));
  const pawnTrade = new Chess('4k3/8/4p3/3p4/4P3/8/8/4K3 w - - 0 1');
  log(seeGain(pawnTrade, 'd5') === 0, 'a guarded pawn is just a trade: ' + seeGain(pawnTrade, 'd5'));
  const play = (ucis, fen) => { const c = new Chess(fen); const v = ucis.map(u => c.move(uciToMove(u))); return { v, fens: [v[0].before, ...v.map(m => m.after)] }; };
  const greek = play(['d3h7'], 'r1bq1rk1/pppn1ppp/4p3/3pP3/1b1P4/2NB1N2/PPP2PPP/R2QK2R w KQ - 0 8');
  log(sacrificed(greek.fens[0], greek.v[0]) === 2, 'Bxh7+ gives up a bishop for a pawn: ' + sacrificed(greek.fens[0], greek.v[0]));
  const trade = play(['e4d5'], 'rnbqkbnr/ppp1pppp/8/3p4/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2');
  log(sacrificed(trade.fens[0], trade.v[0]) <= 0, 'exd5 is not a sacrifice: ' + sacrificed(trade.fens[0], trade.v[0]));
  log(phaseOf(new Chess().fen(), 0) === 'opening' && phaseOf('8/8/4k3/8/8/8/4K3/R7 w - - 0 60', 100) === 'endgame', 'game phases');

  // Grades from made-up engine numbers, so each rule is tested on its own.
  const g1 = play(['e2e4', 'e7e5', 'g1f3', 'd7d6']);
  const fake = (cps, best, alt = []) => gradeMoves(g1.v, g1.fens, { cps, best, alt });
  // cps[i] is the position before move i, White's view.
  let gm = fake([30, 30, 30, 30, 600], ['e2e4', 'e7e5', 'g1f3', 'b8c6']);
  log(gm[3].cls === 'blunder', 'a big drop is a blunder: ' + gm[3].cls);
  const g2 = play(['e2e4', 'e7e5', 'g1f3', 'd7d6', 'b1c3']);
  gm = gradeMoves(g2.v, g2.fens, { cps: [30, 30, 30, 30, 700, 40], best: ['e2e4', 'e7e5', 'g1f3', 'b8c6', 'f3e5'] });
  log(gm[4].cls === 'miss', 'not punishing their blunder, without ending worse than before it, is a miss: ' + gm[4].cls);
  gm = gradeMoves(g2.v, g2.fens, { cps: [30, 30, 30, 30, 700, -300], best: ['e2e4', 'e7e5', 'g1f3', 'b8c6', 'f3e5'] });
  log(gm[4].cls === 'blunder', 'ending worse than before their slip is a plain blunder: ' + gm[4].cls);
  gm = fake([30, 30, 30, 30, 30], ['e2e4', 'e7e5', 'g1f3', 'd7d6'], [null, null, { move: 'b1c3', score: { cp: -500 } }, null]);
  log(gm[2].cls === 'great', 'the only good move is great: ' + gm[2].cls);
  gm = fake([30, 30, 30, 30, 30], ['e2e4', 'e7e5', 'g1f3', 'd7d6'], [null, null, { move: 'b1c3', score: { cp: 0 } }, null]);
  log(gm[2].cls === 'best', 'a best move with fine alternatives is just best: ' + gm[2].cls);
  const perfect = gameAccuracy(fake([30, 30, 30, 30, 30], ['e2e4', 'e7e5', 'g1f3', 'd7d6']), [30, 30, 30, 30, 30], 'w');
  const oneBlunder = fake([30, 30, 30, -800, -800], ['e2e4', 'e7e5', 'b1c3', 'd7d6']);
  const accB = gameAccuracy(oneBlunder, [30, 30, 30, -800, -800], 'w');
  log(perfect > 99 && accB < 60, `accuracy: perfect play ${perfect.toFixed(1)}, one blunder in two moves ${accB.toFixed(1)}`);

  // The same rules on real engine numbers.
  async function engineReview(v, fens) {
    const cps = [], best = [], alt = [];
    for (const f of fens) {
      const c = new Chess(f);
      if (c.isCheckmate()) { cps.push(c.turn() === 'w' ? -10000 : 10000); best.push(null); alt.push(null); continue; }
      const r = await analyser.analyse(f, { depth: 14, multipv: 2 });
      cps.push(scoreToCp(r.score)); best.push(r.bestmove);
      alt.push(r.lines[1] ? { move: r.lines[1].move, score: r.lines[1].score } : null);
    }
    return gradeMoves(v, fens, { cps, best, alt });
  }
  await analyser.init();
  const legal = play(['e2e4', 'e7e5', 'g1f3', 'd7d6', 'f1c4', 'c8g4', 'b1c3', 'g7g6', 'f3e5', 'g4d1', 'c4f7', 'e8e7', 'c3d5']);
  const lg = await engineReview(legal.v, legal.fens);
  log(lg[8].cls === 'brilliant', "Légal's queen sacrifice 5.Nxe5 is brilliant: " + lg[8].cls);
  log(['mistake', 'blunder'].includes(lg[9].cls), 'taking the queen into mate is a blunder: ' + lg[9].cls);
  const qh4 = play(['e2e4', 'e7e5', 'g1f3', 'd8h4', 'd2d3']);
  const qg = await engineReview(qh4.v, qh4.fens);
  log(qg[3].cls === 'blunder' && qg[4].cls === 'miss', `leaving the hung queen is a miss: ${qg[3].cls}, ${qg[4].cls}`);
  log(gameRating(lg, 'w') == null, 'no game rating from fewer than 8 moves');
  flush();

  lines.unshift(fails ? `RESULT: ${fails} FAILURES` : 'RESULT: ALL PASSED');
  flush();

  await fetch('/__log', { method: 'POST', body: lines.join('\n') });
}
run().catch(async e => { lines.unshift('CRASH ' + e.stack); flush(); await fetch('/__log', { method: 'POST', body: lines.join('\n') }); });
</script>
