<!doctype html>
<meta charset="utf-8">
<title>Knightly tests</title>
<pre id="out">running…</pre>
<script type="module">
import { Chess } from '../vendor/chess.js';
import { LESSONS } from '../js/lessons.js';
import { COURSES } from '../js/courses.js';
import { engine } from '../js/engine.js';
import { BOTS, botMove } from '../js/bots.js';
import { explainMove, mistakeReason } from '../js/explain.js';
import { scoreToCp, uciToMove } from '../js/util.js';

const lines = [];
let fails = 0;
const log = (ok, msg) => { if (!ok) fails++; lines.push((ok ? 'PASS ' : 'FAIL ') + msg); };
const info = msg => lines.push('INFO ' + msg);
const flush = () => { document.getElementById('out').textContent = lines.join('\n'); };

function setup(step) {
  if (step.fen) return new Chess(step.fen);
  if (step.line) { const c = new Chess(); for (const s of step.line.split(/\s+/)) c.move(s); return c; }
  return null;
}

// score from the mover's perspective after playing uci
async function moverScore(fen, uci, depth = 14) {
  const c = new Chess(fen);
  const mover = c.turn();
  c.move(uciToMove(uci));
  if (c.isCheckmate()) return 100000;
  if (c.isDraw()) return 0;
  const r = await engine.analyse(c.fen(), { depth });
  const white = scoreToCp(r.score);
  return mover === 'w' ? white : -white;
}

async function run() {
  await engine.init();
  info('engine ready');
  const r0 = await engine.analyse(new Chess().fen(), { depth: 10 });
  log(!!r0.bestmove, 'engine start position bestmove ' + r0.bestmove);

  // ---------- lessons ----------
  for (const l of LESSONS) {
    for (let i = 0; i < l.steps.length; i++) {
      const s = l.steps[i];
      const tag = `lesson ${l.id} step ${i + 1}`;
      let c;
      try { c = setup(s); } catch (e) { log(false, `${tag} setup: ${e.message}`); continue; }
      if (!c) { if (s.task || s.play) log(false, `${tag} task without position`); continue; }
      if (s.showMoves && !c.get(s.showMoves)) log(false, `${tag} showMoves square empty`);
      if (s.arrows) for (const a of s.arrows) if (!/^[a-h][1-8]$/.test(a[0]) || !/^[a-h][1-8]$/.test(a[1])) log(false, `${tag} bad arrow`);
      if (s.task && !s.task.anyMove) {
        const t = s.task;
        const fen0 = c.fen();
        // solution legality
        const w = new Chess(fen0);
        let ok = true;
        for (const u of t.solution) { try { w.move(uciToMove(u)); } catch { ok = false; log(false, `${tag} illegal solution move ${u}`); break; } }
        if (!ok) continue;
        if (t.mate) log(w.isCheckmate(), `${tag} solution ends in mate`);
        for (const a of (t.accept || [])) { try { new Chess(fen0).move(uciToMove(a)); } catch { log(false, `${tag} illegal accept ${a}`); } }
        // engine: compare each accepted first move with the engine's best
        const best = await engine.analyse(fen0, { depth: 16 });
        const bestScore = await moverScore(fen0, best.bestmove, 14);
        const firsts = t.accept || [t.solution[0]];
        for (const f of firsts) {
          const sc = await moverScore(fen0, f, 14);
          // 'teach' moves are sound book/principle moves; allow engine noise at this depth
          const good = t.teach ? sc > -90 : (sc >= bestScore - 80 || sc > 600);
          log(good, `${tag} move ${f} score ${sc} vs engine best ${best.bestmove} ${bestScore}`);
        }
      }
      if (s.task && s.task.anyMove) log(c.moves().length > 0, `${tag} has legal moves`);
      if (s.play) {
        const r = await engine.analyse(c.fen(), { depth: 16 });
        const sc = scoreToCp(r.score) * (c.turn() === 'w' ? 1 : -1);
        log(sc > 400, `${tag} play position winning for student (${sc})`);
      }
    }
  }
  flush();

  // ---------- courses ----------
  for (const co of COURSES) {
    const c = new Chess();
    try { for (const m of co.moves) c.move(m); log(true, `course ${co.id} line legal (${co.moves.length} plies)`); }
    catch (e) { log(false, `course ${co.id}: ${e.message}`); }
    for (const k of Object.keys(co.notes)) if (+k >= co.moves.length) log(false, `course ${co.id} note index ${k} out of range`);
    const last = co.moves.length - 1;
    // last move should be by... nothing required. Check final eval not losing for the student
    const r = await engine.analyse(c.fen(), { depth: 12 });
    const sc = scoreToCp(r.score) * (co.side === 'w' ? 1 : -1);
    log(sc > (co.level === 'Advanced' ? -250 : -170), `course ${co.id} final position ok for student (${sc})`);
  }
  flush();

  // ---------- puzzles ----------
  try {
    const db = await fetch('../data/puzzles.json').then(r => r.json());
    let bad = 0;
    const buckets = {};
    for (const p of db) {
      try {
        const c = new Chess(p.fen);
        for (const u of p.m.split(' ')) c.move(uciToMove(u));
      } catch (e) { bad++; if (bad < 5) info(`bad puzzle ${p.id}: ${e.message}`); }
      const b = Math.floor(p.r / 200) * 200; buckets[b] = (buckets[b] || 0) + 1;
    }
    log(bad === 0, `puzzles: ${db.length} total, ${bad} invalid`);
    info('rating buckets ' + JSON.stringify(buckets));
  } catch (e) { info('puzzles not available: ' + e.message); }
  flush();

  // ---------- bots ----------
  const testFen = 'r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3';
  for (const b of BOTS) {
    const c = new Chess(testFen);
    const t0 = performance.now();
    const u = await botMove(b, c);
    let legal = false;
    try { c.move(uciToMove(u)); legal = true; } catch { }
    log(legal, `bot ${b.id} move ${u} in ${Math.round(performance.now() - t0)}ms`);
  }
  // promotion move format from engine
  const pc = new Chess('8/4P1k1/8/8/8/8/8/4K3 w - - 0 1');
  const pr = await engine.analyse(pc.fen(), { depth: 8 });
  log(pr.bestmove === 'e7e8q', 'engine promotion uci ' + pr.bestmove);

  // ---------- coach explanations ----------
  const plain = r => r.reasons.join(' ').replace(/<[^>]+>/g, '');
  const defended = '4k3/pp3ppp/2n1p3/3p4/2P5/8/PP3PPP/4K3 w - - 0 1';
  log(!/takes back/.test(plain(explainMove(defended, 'c4d5'))), 'behind in material is not a recapture');
  log(/takes back on d5/.test(plain(explainMove(defended, 'c4d5', {}, { captured: 'p', to: 'd5' }))), 'a real recapture says takes back');
  const exchange = { score: { cp: 200 }, lines: [{ pv: ['e2h5', 'f7f6', 'h5e8', 'd6e8'] }] };
  log(/material \(\+2\)/.test(plain(explainMove('4r3/5k2/3n4/8/8/8/4B3/3K4 w - - 0 1', 'e2h5', exchange))), 'rook for a knight is not two pawns');
  log(/pawn on f5/.test(plain(explainMove('4k3/8/8/4Pp2/8/8/8/4K3 w - f6 0 1', 'e5f6'))), 'en passant names the captured pawn\'s square');
  const ruy = 'r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3';
  log(mistakeReason(ruy, 'a7a6', { replyUci: 'b5c6' }) === '', 'a fair trade is not called a loss');
  log(/queen on e5 can be taken/.test(mistakeReason('r1b1kbnr/pppp1ppp/2n5/4p2Q/4P3/8/PPPP1PPP/RNB1KBNR w KQkq - 2 3', 'h5e5', { replyUci: 'c6e5' })), 'a hanging piece is called out');

  lines.unshift(fails ? `RESULT: ${fails} FAILURES` : 'RESULT: ALL PASSED');
  flush();
  await fetch('/__log', { method: 'POST', body: lines.join('\n') });
}
run().catch(async e => { lines.unshift('CRASH ' + e.stack); flush(); await fetch('/__log', { method: 'POST', body: lines.join('\n') }); });
</script>
