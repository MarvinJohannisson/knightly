<!doctype html>
<meta charset="utf-8">
<title>Knightly coach samples</title>
<style>body{font:13px/1.45 system-ui;margin:16px;max-width:820px}h3{margin:18px 0 4px}code{color:#666}ul,ol{margin:4px 0}.muted{color:#777}.small{font-size:12px}.tag{font-weight:700;border:1px solid #999;border-radius:4px;padding:0 4px;font-size:11px}</style>
<p>What the coach says about a set of positions: the hint in three steps, then the top moves compared.
Add <code>?fen=...</code> to try a position of your own.</p>
<div id="out">running…</div>
<script type="module">
import { engine } from '../js/engine.js';
import { explainMove, hintIdea, runnerUp, compareMoves, reasonList, footnote } from '../js/explain.js';

const SAMPLES = {
  'Start': 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
  'Italian, quiet': 'r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4',
  'Ruy Lopez, Black': 'r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3',
  'Knight fork': 'r3k2r/ppp2ppp/2n5/3N4/8/8/PPP2PPP/R3K2R w KQkq - 0 12',
  'Weak f7': 'r1bqkb1r/ppp2ppp/2np1n2/4p3/2B1P3/2NP1N2/PPP2PPP/R1BQK2R w KQkq - 0 5',
  'Mate in one': 'r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4',
  'Pinned knight': 'r2qkbnr/ppp2ppp/2np4/4p3/2B1P1b1/2N2N2/PPPP1PPP/R1BQK2R w KQkq - 2 5',
  'King and pawn': '8/8/8/4k3/8/3PK3/8/8 w - - 0 50',
  'Rook ending': '8/5pk1/6p1/8/3R4/6P1/5PK1/1r6 w - - 0 40',
  'Pin the queen': '8/8/3k4/8/8/3q4/8/R3K3 w - - 0 50',
  'Free knight': 'r1bqk2r/pppp1ppp/2n2n2/4N3/1bB1P3/2N5/PPPP1PPP/R1BQK2R b KQkq - 0 5',
  'Queen\'s Gambit': 'rnbqkb1r/ppp1pppp/5n2/3p4/2PP4/8/PP2PPPP/RNBQKBNR w KQkq - 1 3',
  'Back rank': '6k1/5ppp/8/8/8/8/q4PPP/3R2K1 w - - 0 30',
  'Two mates': '6k1/5ppp/8/8/8/8/5PPP/1R1R2K1 w - - 0 30',
  'Knight attacked': 'r1bqkbnr/ppp2ppp/2n5/3Pp3/8/5N2/PPPP1PPP/RNBQKB1R b KQkq - 0 4',
  'In check': 'r1bqk2r/pppp1ppp/2n2n2/8/1bBPP3/5N2/PP3PPP/RNBQK2R w KQkq - 1 7',
  'Skewer': '8/8/8/3k4/8/8/3r4/B3K3 w - - 0 50',
  'Bishop pin': 'r2qkbnr/ppp2ppp/2np4/4p3/4P1b1/2N2N2/PPPP1PPP/R1BQKB1R w KQkq - 2 5',
  'Pawn sacrifice': 'r2qkbnr/1b1npppp/p1p5/1p1pP3/P2P4/1PNBBN2/2P2PPP/R1Q1K2R w KQkq - 1 10',
  'Gambit while in check': 'r1bqk2r/pppp1ppp/2n2n2/8/1bBPP3/5N2/PP3PPP/RNBQK2R w KQkq - 1 7',
  'Losing':'6k1/5ppp/8/8/8/2q5/5PPP/R5K1 w - - 0 30',
};
const fen = new URLSearchParams(location.search).get('fen');
const list = fen ? { 'Your position': fen } : SAMPLES;
const out = document.getElementById('out');
out.textContent = '';
for (const [name, f] of Object.entries(list)) {
  const t0 = performance.now();
  const r = await engine.analyse(f, { depth: 14, multipv: 3, movetime: 2500 });
  const ms = Math.round(performance.now() - t0);
  let html;
  try {
    const ex = explainMove(f, r.bestmove, r);
    const cmp = compareMoves(f, r, f.split(' ')[1]);
    html = `<div>1. ${hintIdea(f, r.bestmove, r)}</div>
      <div>3. The engine suggests <b>${ex.san}</b>.${reasonList(ex.reasons)}${footnote(ex.line, ex.eval)}<div class="small muted">${runnerUp(f, r)}</div></div>
      <div style="margin-top:6px">${cmp.html}</div>`;
  } catch (e) { html = `<pre>FAILED ${e.stack}</pre>`; }
  out.insertAdjacentHTML('beforeend', `<h3>${name} <span class="muted small">depth ${r.lines.map(l => l.depth).join('/')}, ${ms} ms</span></h3><code>${f}</code>${html}`);
}
out.insertAdjacentHTML('beforeend', '<p id="done">done</p>');
</script>
